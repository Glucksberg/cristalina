id: pol-projection-default
kind: projection_policy
status: active
default_profiles:
  owner_private: deep
  agent_operational: standard
  project_private: standard
  shareable: standard
  public_safe: tiny
channel_profile_rules:
  - match_prefix: group_
    profile: tiny
  - match_prefix: public_
    profile: tiny
  - match_prefix: project_
    profile: standard
  - match_prefix: agent_
    profile: standard
  - match_prefix: shareable_
    profile: standard
  - match_prefix: owner_
    profile: deep
tier_limits:
  tiny:
    hot: 8
    warm: 6
    cold: 8
  standard:
    hot: 14
    warm: 18
    cold: 24
  deep:
    hot: 24
    warm: 40
    cold: 60
kind_weights:
  - kind: identity_trait
    weight: 15
  - kind: value
    weight: 15
  - kind: priority
    weight: 15
  - kind: style_rule
    weight: 10
  - kind: preference
    weight: 10
  - kind: constraint
    weight: 8
always_hot_kinds: [identity_trait, value, priority, style_rule]
metadata:
  version: 1
  updated_at: "2026-03-29T02:00:00Z"
