id: pol-projection-default
kind: projection_policy
default_profiles:
  owner_private: deep
  agent_operational: standard
  project_private: standard
  shareable: standard
  public_safe: tiny
tier_limits:
  tiny:
    hot: 8
    warm: 6
    cold: 8
  standard:
    hot: 14
    warm: 18
    cold: 24
  deep:
    hot: 24
    warm: 40
    cold: 60
always_hot_kinds: [identity_trait, value, priority, style_rule]
